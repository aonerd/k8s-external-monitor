global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Scrape kube-state-metrics (HPA, pods, deployments, etc.)
  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - kube-state-metrics:8080

  # kube-state-metrics self-telemetry
  - job_name: kube-state-metrics-telemetry
    static_configs:
      - targets:
          - kube-state-metrics:8081

  # Scrape k8s-metrics-exporter (CPU/memory from metrics.k8s.io + events)
  - job_name: k8s-metrics-exporter
    static_configs:
      - targets:
          - k8s-metrics-exporter:9101

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
